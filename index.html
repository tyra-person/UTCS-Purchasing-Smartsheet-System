document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 --h1-size: var(--text-4xl);\n  --h2-size: var(--text-3xl);\n  --h3-size: var(--text-2xl);\n  --h4-size: var(--text-xl);\n  --h5-size: var(--text-lg);\n  --h6-size: var(--text-base);\n}\n<\u002Fstyle>\n  <style>/* UT Austin Spacing Tokens — ITS-UTX Design System\n   Based on Bootstrap 4's 4px base unit ($spacer: 1rem = 16px) */\n\n:root {\n  /* ─── Base spacer ─── */\n  --spacer: 1rem;   /* 16px */\n\n  /* ─── Scale (Bootstrap 0–5 + extras) ─── */\n  --space-0:    0;\n  --space-1:    0.25rem;   /*  4px */\n  --space-2:    0.5rem;    /*  8px */\n  --space-3:    1rem;      /* 16px */\n  --space-4:    1.5rem;    /* 24px */\n  --space-5:    3rem;      /* 48px */\n\n  /* ─── Named aliases ─── */\n  --space-xs:   var(--space-1);\n  --space-sm:   var(--space-2);\n  --space-md:   var(--space-3);\n  --space-lg:   var(--space-4);\n  --space-xl:   var(--space-5);\n  --space-2xl:  4rem;    /* 64px */\n  --space-3xl:  6rem;    /* 96px */\n\n  /* ─── Component-level defaults ─── */\n  --padding-btn:      0.375rem 0.75rem;   /* Bootstrap 5.2 btn default */\n  --padding-btn-sm:   0.25rem 0.5rem;\n  --padding-btn-lg:   0.5rem 1rem;\n\n  --padding-input:    0.375rem 0.75rem;\n  --padding-card:     1.25rem;\n  --padding-section:  var(--space-5);\n\n  --border-radius:    0.375rem;  /* 6px — Bootstrap 5.2 default */\n  --border-radius-sm: 0.25rem;\n  --border-radius-lg: 0.5rem;\n  --border-radius-pill: 50rem;\n\n  /* ─── Shadows ─── */\n  --shadow-sm:   0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);\n  --shadow-md:   0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);\n  --shadow-lg:   0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);\n\n  /* ─── Breakpoints (reference only, use in media queries) ─── */\n  --bp-sm:  576px;\n  --bp-md:  768px;\n  --bp-lg:  992px;\n  --bp-xl:  1200px;\n}\n<\u002Fstyle>\n  <style>/* UT Austin ITS-UTX Design System — Global Entry Point\n   Import this file in consuming projects. Do not add rules here — imports only. */\n\n/* UT Austin Bra ormat('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* ─── Font families ─── */\n  --font-serif:       'Libre Baskerville', Georgia, 'Times New Roman', serif;\n  --font-sans:        'Source Sans 3', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n  --font-mono:        'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;\n\n  /* ─── Font weights ─── */\n  --font-weight-light:   300;\n  --font-weight-regular: 400;\n  --font-weight-semibold: 600;\n  --font-weight-bold:    700;\n\n  /* ─── Type scale (Bootstrap 4 base: 16px) ─── */\n  --text-xs:   0.75rem;    /* 12px */\n  --text-sm:   0.875rem;   /* 14px */\n  --text-base: 1rem;       /* 16px */\n  --text-lg:   1.125rem;   /* 18px */\n  --text-xl:   1.25rem;    /* 20px */\n  --text-2xl:  1.5rem;     /* 24px */\n  --text-3xl:  1.75rem;    /* 28px */\n  --text-4xl:  2rem;       /* 32px */\n  --text-5xl:  2.5rem;     /* 40px */\n\n  /* ─── Line heights ─── */\n  --leading-tight:  1.25;\n  --leading-snug:   1.375;\n  --leading-normal: 1.5;\n  --leading-relaxed: 1.625;\n\n  /* ─── Semantic aliases ─── */\n  --font-display:   var(--font-serif);\n  --font-body:      var(--font-sans);\n  --font-ui:        var(--font-sans);\n  --font-code:      var(--font-mono);\n\n  --text-heading-font:   var(--font-serif);\n  --text-heading-weight: var(--font-weight-bold);\n  --text-body-font:      var(--font-sans);\n  --text-body-size:      var(--text-base);\n  --text-body-line-height: var(--leading-normal);\n\n  /* ─── Heading sizes ─── */\n  --h1-size: var(--text-4xl);\n  --h2-size: var(--text-3xl);\n  --h3-size: var(--text-2xl);\n  --h4-size: var(--text-xl);\n  --h5-size: var(--text-lg);\n  --h6-size: var(--text-base);\n}\n\n/* UT Austin Spacing Tokens — ITS-UTX Design System\n   Based on Bootstrap 4's 4px base unit ($spacer: 1rem = 16px) */\n\n:root {\n  /* ─── Base spacer ─── */\n  --spacer: 1rem;   /* 16px */\n\n  /* ─── Scale (Bootstrap 0–5 + extras) ─── */\n  --space-0:    0;\n  --space-1:    0.25rem;   /*  4px */\n  --space-2:    0.5rem;    /*  8px */\n  --space-3:    1rem;      /* 16px */\n  --space-4:    1.5rem;    /* 24px */\n  --space-5:    3rem;      /* 48px */\n\n  /* ─── Named aliases ─── */\n  --space-xs:   var(--space-1);\n  --space-sm:   var(--space-2);\n  --space-md:   var(--space-3);\n  --space-lg:   var(--space-4);\n  --space-xl:   var(--space-5);\n  --space-2xl:  4rem;    /* 64px */\n  --space-3xl:  6rem;    /* 96px */\n\n  /* ─── Component-level defaults ─── */\n  --padding-btn:      0.375rem 0.75rem;   /* Bootstrap 5.2 btn default */\n  --padding-btn-sm:   0.25rem 0.5rem;\n  --padding-btn-lg:   0.5rem 1rem;\n\n  --padding-input:    0.375rem 0.75rem;\n  --padding-card:     1.25rem;\n  --padding-section:  var(--space-5);\n\n  --border-radius:    0.375rem;  /* 6px — Bootstrap 5.2 default */\n  --border-radius-sm: 0.25rem;\n  --border-radius-lg: 0.5rem;\n  --border-radius-pill: 50rem;\n\n  /* ─── Shadows ─── */\n  --shadow-sm:   0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.08);\n  --shadow-md:   0 4px 6px rgba(0,0,0,0.1), 0 2px 4px rgba(0,0,0,0.06);\n  --shadow-lg:   0 10px 15px rgba(0,0,0,0.1), 0 4px 6px rgba(0,0,0,0.05);\n\n  /* ─── Breakpoints (reference only, use in media queries) ─── */\n  --bp-sm:  576px;\n  --bp-md:  768px;\n  --bp-lg:  992px;\n  --bp-xl:  1200px;\n}\n\n<\u002Fstyle>\n  <script src=\"f2b916a2-d79a-46a4-8565-7e4f7223a2d6\"><\u002Fscript>\n  <style id=\"__om-edit-overrides\">\n    a { color: var(--ut-blue); text-decoration: none; }\n    a:hover { color: #004060; text-decoration: underline; }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; background:var(--color-bg-page); font-family:var(--font-sans); color:var(--color-text-body);\">\n\n  <!-- Header -->\n  <header style=\"background:#fff; border-bottom:1px solid var(--color-border);\">\n    <div style=\"max-width:1140px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; padding:0.9rem 1.5rem;\">\n      <div style=\"display:flex; align-items:center; gap:0.6rem;\">\n        <div style=\"background:var(--ut-burnt-orange); color:#fff; font-weight:700; font-size:0.85rem; width:34px; height:34px; display:flex; align-items:center; justify-content:center; border-radius:4px;\">UT<\u002Fdiv>\n        <span style=\"font-weight:700; font-size:1.05rem; color:var(--ut-charcoal);\">UTCS<\u002Fspan>\n        <span style=\"font-size:1.05rem; color:var(--color-text-muted);\">Purchasing System<\u002Fspan>\n      <\u002Fdiv>\n      <sc-if value=\"{{ showWorkspaceLink }}\" hint-placeholder-val=\"{{ true }}\">\n        <a href=\"https://app.smartsheet.com/browse/workspaces/gGGCH8RcGVpQwFf5Ch4327g5QMRFQMRgRm3cQ2x1\" target=\"_blank\" style=\"font-size:var(--text-sm); font-weight:600;\">Smartsheet workspace ↗<\u002Fa>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <nav style=\"max-width:1140px; margin:0 auto; padding:0 1.5rem; display:flex; gap:1.75rem;\">\n      <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n        <a href=\"#\" sc-camel-on-click=\"{{ t.select }}\" data-screen-label=\"{{ t.label }}\" style=\"padding:0.75rem 0; font-size:var(--text-base); font-weight:600; text-decoration:none; color:{{ t.color }}; border-bottom:2px solid {{ t.borderColor }};\">{{ t.label }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <main style=\"max-width:1140px; margin:0 auto; padding:2.5rem 1.5rem 4rem;\">\n\n    <!-- ============ OVERVIEW ============ -->\n    <sc-if value=\"{{ isOverview }}\" hint-placeholder-val=\"{{ true }}\">\n      <div data-screen-label=\"Overview\">\n        <div style=\"font-size:var(--text-xs); font-weight:700; letter-spacing:0.08em; color:var(--ut-burnt-orange); text-transform:uppercase;\">Smartsheet workflow<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-serif); font-weight:700; font-size:var(--text-4xl); color:var(--ut-charcoal); margin:0.25rem 0 0;\">System overview<\u002Fh1>\n        <h2 style=\"font-family:var(--font-serif); font-weight:700; font-size:var(--text-3xl); color:var(--ut-burnt-orange); margin:0 0 0.75rem;\">The purchase request flow.<\u002Fh2>\n        <div style=\"display:flex; justify-content:space-between; align-items:flex-end; gap:1rem; flex-wrap:wrap; margin-bottom:1.5rem;\">\n          <p style=\"font-size:var(--text-lg); color:var(--color-text-muted); margin:0;\">How a purchase request (PReq) moves from sheet to sheet.<\u002Fp>\n          <div style=\"text-align:right; font-size:var(--text-sm); color:var(--color-text-muted); line-height:1.4;\">\n            The University of Texas at Austin<br>Department of Computer Science\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-left:4px solid var(--ut-burnt-orange); border-radius:var(--border-radius); padding:1rem 1.25rem; margin-bottom:2rem;\">\n          <strong style=\"color:var(--ut-burnt-orange);\">Non-IT purchases under $15,000.<\u002Fstrong> For IT purchases or requests of $15,000 or more, use <a href=\"https://apps.cs.utexas.edu/req/index.php\" target=\"_blank\">UTCS Direct PReq<\u002Fa>.\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem;\">\n          <div style=\"display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;\">\n            <span style=\"font-weight:600; color:var(--color-text-muted); font-size:var(--text-sm);\">System overview / PReq flow<\u002Fspan>\n            <span style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); letter-spacing:0.05em;\">READ TOP TO BOTTOM ↓<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:1rem; margin-bottom:0.25rem;\">\n            <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">SHEET 1<\u002Fdiv>\n            <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal);\">Purchase Request Intake Form<\u002Fdiv>\n            <div style=\"color:var(--color-text-muted); font-size:var(--text-sm);\">Requester submits the purchase request.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; color:var(--ut-burnt-orange); font-size:1.25rem; line-height:1.6;\">↓<\u002Fdiv>\n          <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:1rem; margin-bottom:0.25rem;\">\n            <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">SHEET 2<\u002Fdiv>\n            <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal);\">Accountant &amp; Supervisor Review<\u002Fdiv>\n            <div style=\"color:var(--color-text-muted); font-size:var(--text-sm);\">Accountant and purchaser auto-assigned. Account number entered; supervisor approval if needed.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"text-align:center; color:var(--ut-burnt-orange); font-size:1.25rem; line-height:1.6;\">↓<\u002Fdiv>\n\n          <div style=\"background:#fdf1e6; border:1px solid #f4bfa0; border-radius:var(--border-radius-sm); padding:1rem; text-align:center; margin-bottom:0.75rem;\">\n            <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange); letter-spacing:0.05em;\">ROUTING DECISION<\u002Fdiv>\n            <div style=\"font-weight:700; color:var(--ut-charcoal);\">Entertainment purchase with Event Order Method set to ATG or Reimbursement (Person)?<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:1rem; align-items:start;\">\n            <div>\n              <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); margin-bottom:0.35rem;\"><span style=\"color:var(--ut-burnt-orange);\">YES<\u002Fspan> · Direct to reconciliation<\u002Fdiv>\n              <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:1rem;\">\n                <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">SHEET 4<\u002Fdiv>\n                <div style=\"font-weight:700; color:var(--ut-charcoal);\">MISC Payments &amp; Reconciliation<\u002Fdiv>\n                <div style=\"color:var(--color-text-muted); font-size:var(--text-sm);\">Moves directly from Sheet 2.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); margin-bottom:0.35rem;\"><span style=\"color:var(--ut-burnt-orange);\">NO<\u002Fspan> · Continue to purchasing<\u002Fdiv>\n              <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:1rem; margin-bottom:0.75rem;\">\n                <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">SHEET 3<\u002Fdiv>\n                <div style=\"font-weight:700; color:var(--ut-charcoal);\">Purchaser Sheet<\u002Fdiv>\n                <div style=\"color:var(--color-text-muted); font-size:var(--text-sm);\">PO created, or items ordered and received. Entertainment POs move to Sheet 4 as soon as the PO is approved.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:0.75rem 1rem; text-align:center; margin-bottom:0.5rem;\">\n                <span style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">↔<\u002Fspan>\n                <span style=\"font-weight:700; font-size:var(--text-sm); color:var(--ut-charcoal);\">Sheet 6 · Canceled PReqs<\u002Fspan>\n                <div style=\"color:var(--color-text-muted); font-size:var(--text-xs); margin-top:0.15rem;\">At any point on Sheet 3, setting Status to <strong>CANCELED<\u002Fstrong> moves the row to Sheet 6. Toggle it back to Sheet 3 to resume.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"text-align:center; font-size:var(--text-xs); color:var(--color-text-muted); margin-bottom:0.5rem;\">Sheet 3 branches by payment method<\u002Fdiv>\n              <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:0.75rem;\">\n                <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:0.75rem;\">\n                  <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">SHEET 4<\u002Fdiv>\n                  <div style=\"font-weight:700; font-size:var(--text-sm); color:var(--ut-charcoal);\">MISC Payments &amp; Reconciliation<\u002Fdiv>\n                  <div style=\"color:var(--color-text-muted); font-size:var(--text-xs);\">PO / IDT, ready for payment<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"border:1px solid var(--color-border); border-radius:var(--border-radius-sm); padding:0.75rem;\">\n                  <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-burnt-orange);\">SHEET 4.VP7<\u002Fdiv>\n                  <div style=\"font-weight:700; font-size:var(--text-sm); color:var(--ut-charcoal);\">VP7 Payments &amp; Reconciliation<\u002Fdiv>\n                  <div style=\"color:var(--color-text-muted); font-size:var(--text-xs);\">Procard / VP7<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"text-align:center; color:var(--ut-burnt-orange); font-size:1.25rem; line-height:1.6; margin-top:0.75rem;\">↓<\u002Fdiv>\n          <div style=\"text-align:center; font-size:var(--text-sm); color:var(--color-text-muted); margin-bottom:0.5rem;\">All payment paths converge when Status is set to <strong>Purchase Reconciled<\u002Fstrong> and the Fiscal Year is entered.<\u002Fdiv>\n          <div style=\"background:#eef6ee; border-left:4px solid var(--ut-green); border-radius:var(--border-radius-sm); padding:1rem;\">\n            <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--ut-green);\">SHEET 5<\u002Fdiv>\n            <div style=\"font-weight:700; color:var(--ut-charcoal);\">Closed PReqs — Fiscal Year Archive<\u002Fdiv>\n            <div style=\"color:var(--color-text-muted); font-size:var(--text-sm);\">Completed requests move to the appropriate fiscal-year archive. For MISC payments, the reconciled date records on arrival.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:2rem;\">\n          <sc-for list=\"{{ roleSummaries }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <a href=\"#\" sc-camel-on-click=\"{{ r.select }}\" style=\"display:block; background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.25rem; text-decoration:none;\">\n              <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); letter-spacing:0.05em;\">{{ r.num }} / {{ r.role }}<\u002Fdiv>\n              <div style=\"font-weight:700; color:var(--ut-charcoal); margin-top:0.25rem;\">{{ r.desc }} ↗<\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ REQUESTER ============ -->\n    <sc-if value=\"{{ isRequester }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Requester\">\n        <div style=\"font-size:var(--text-xs); font-weight:700; letter-spacing:0.08em; color:var(--ut-burnt-orange); text-transform:uppercase;\">UTCS purchasing system<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-serif); font-weight:700; font-size:var(--text-4xl); color:var(--ut-charcoal); margin:0.25rem 0 0.5rem;\">Requester guide<\u002Fh1>\n        <p style=\"font-size:var(--text-lg); color:var(--color-text-muted); margin:0 0 1.25rem;\">Prepare the information and attachments needed to submit a purchase request.<\u002Fp>\n        <x-import component-from-global-scope=\"UTAustinITSUTXDesignSystem_c2776b.Button\" variant=\"primary\" hint-size=\"auto,44px\"><a href=\"https://app.smartsheet.com/b/form/019cf737c4e97c409147c12327c53ceb\" target=\"_blank\" style=\"color:#fff; text-decoration:none;\">Open purchase request form ↗<\u002Fa><\u002Fx-import>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:2rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Before you begin<\u002Fdiv>\n          <div style=\"background:#fdf1e6; border-left:3px solid var(--ut-burnt-orange); border-radius:var(--border-radius-sm); padding:0.9rem 1.1rem; margin-bottom:0.9rem;\">\n            <strong style=\"color:var(--ut-burnt-orange);\">Use Smartsheet for non-IT purchases under $15,000.<\u002Fstrong> Submit IT purchases and purchases totaling $15,000 or more through <a href=\"https://apps.cs.utexas.edu/req/index.php\" target=\"_blank\">UTCS Direct PReq<\u002Fa>.\n          <\u002Fdiv>\n          <p style=\"margin:0; color:var(--color-text-body);\">Students and postdocs need authorization from a faculty supervisor or PI. Have the authorizer’s name and email address ready.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.5rem;\">Prepare your intake form<\u002Fdiv>\n          <sc-for list=\"{{ requesterSections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid var(--color-border); padding:1rem 0;\">\n              <div sc-camel-on-click=\"{{ sec.toggle }}\" style=\"display:flex; justify-content:space-between; align-items:center; cursor:pointer;\">\n                <span style=\"font-weight:700; color:var(--ut-charcoal);\">{{ sec.title }}<\u002Fspan>\n                <span style=\"color:var(--ut-burnt-orange); font-size:1.25rem; font-weight:700;\">{{ sec.icon }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sec.isOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                <ul style=\"margin:0.75rem 0 0; padding-left:1.25rem; color:var(--color-text-body); line-height:1.6;\">\n                  <sc-for list=\"{{ sec.items }}\" as=\"li\" hint-placeholder-count=\"3\">\n                    <li style=\"margin-bottom:0.4rem;\"><sc-if value=\"{{ li.b }}\" hint-placeholder-val=\"{{ false }}\"><strong>{{ li.b }}<\u002Fstrong> <\u002Fsc-if>{{ li.t }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Ful>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:2rem;\">\n          <sc-for list=\"{{ roleSummaries }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <a href=\"#\" sc-camel-on-click=\"{{ r.select }}\" style=\"display:block; background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.25rem; text-decoration:none;\">\n              <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); letter-spacing:0.05em;\">{{ r.num }} / {{ r.role }}<\u002Fdiv>\n              <div style=\"font-weight:700; color:var(--ut-charcoal); margin-top:0.25rem;\">{{ r.desc }} ↗<\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">After you submit<\u002Fdiv>\n          <p style=\"margin:0 0 0.5rem;\">Requests go to Accounting for review and approval, then to Purchasing. You’ll receive email notifications:<\u002Fp>\n          <ul style=\"margin:0 0 0.75rem; padding-left:1.25rem; line-height:1.6;\">\n            <li>When the PReq is submitted and pending an account number.<\u002Fli>\n            <li>When the PReq is sent to Purchasing for review.<\u002Fli>\n            <li>When items are ordered and received.<\u002Fli>\n            <li>If an invoice or receipt is needed from you.<\u002Fli>\n          <\u002Ful>\n          <p style=\"margin:0; color:var(--color-text-muted); font-size:var(--text-sm);\">To ask a question or provide an update, reply directly to the automated notification email — it starts a thread with the correct party.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Need a custom report?<\u002Fdiv>\n          <p style=\"margin:0 0 0.75rem;\">If you need a custom report of your PReqs status, email or Slack Tyra Person at <a href=\"mailto:tls2022@cs.utexas.edu\">tls2022@cs.utexas.edu<\u002Fa>.<\u002Fp>\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.5rem;\">System feedback<\u002Fdiv>\n          <p style=\"margin:0;\">Have a suggestion or found an issue? <a href=\"https://app.smartsheet.com/b/form/019e459ac6ce7248bdbef81c7a14d705\" target=\"_blank\">Submit system feedback ↗<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ ACCOUNTANT ============ -->\n    <sc-if value=\"{{ isAccountant }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Accountant\">\n        <div style=\"font-size:var(--text-xs); font-weight:700; letter-spacing:0.08em; color:var(--ut-burnt-orange); text-transform:uppercase;\">UTCS purchasing system<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-serif); font-weight:700; font-size:var(--text-4xl); color:var(--ut-charcoal); margin:0.25rem 0 0.5rem;\">Accountant workflow<\u002Fh1>\n        <p style=\"font-size:var(--text-lg); color:var(--color-text-muted); margin:0 0 1.25rem;\">Review accounts and approvals, process payments, and reconcile completed purchases.<\u002Fp>\n        <x-import component-from-global-scope=\"UTAustinITSUTXDesignSystem_c2776b.Button\" variant=\"primary\" hint-size=\"auto,44px\"><a href=\"#\" style=\"color:#fff; text-decoration:none;\">Open Smartsheet workspace ↗<\u002Fa><\u002Fx-import>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:2rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:1rem;\">Accounting groups<\u002Fdiv>\n          <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem;\">\n            <sc-for list=\"{{ accountingGroups }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div>\n                <div style=\"font-weight:700; color:var(--ut-charcoal);\">{{ g.name }}<\u002Fdiv>\n                <div style=\"color:var(--color-text-muted); font-size:var(--text-sm); margin:0.15rem 0 0.4rem;\">{{ g.desc }}<\u002Fdiv>\n                <a href=\"mailto:{{ g.email }}\" style=\"font-size:var(--text-sm);\">{{ g.email }}<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Sheet 2 · Review and approval<\u002Fdiv>\n          <ol style=\"margin:0 0 0.5rem; padding-left:1.25rem; line-height:1.7;\">\n            <sc-for list=\"{{ sheet2Steps }}\" as=\"li\" hint-placeholder-count=\"6\">\n              <li><sc-if value=\"{{ li.b }}\" hint-placeholder-val=\"{{ false }}\"><strong>{{ li.b }}<\u002Fstrong> <\u002Fsc-if>{{ li.t }}<\u002Fli>\n            <\u002Fsc-for>\n          <\u002Fol>\n          <div style=\"border-top:1px solid var(--color-border); padding-top:0.75rem;\">\n            <div sc-camel-on-click=\"{{ autoAssign.toggle }}\" style=\"display:flex; justify-content:space-between; align-items:center; cursor:pointer;\">\n              <span style=\"font-weight:700; color:var(--ut-charcoal);\">Automatic purchaser assignments<\u002Fspan>\n              <span style=\"color:var(--ut-burnt-orange); font-size:1.25rem; font-weight:700;\">{{ autoAssign.icon }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ autoAssign.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <ul style=\"margin:0.75rem 0 0.75rem; padding-left:1.25rem; line-height:1.6;\">\n                <li>Texas Robotics + Amazon → April<\u002Fli>\n                <li>Student Orgs + Amazon → Jayvin<\u002Fli>\n                <li>MLL + Amazon → Noemi<\u002Fli>\n                <li>All other requests default to Norma Belt.<\u002Fli>\n              <\u002Ful>\n              <div style=\"background:#fdf1e6; border-left:3px solid var(--ut-burnt-orange); border-radius:var(--border-radius-sm); padding:0.9rem 1.1rem; font-size:var(--text-sm);\">\n                As of July 21, 2026, this single rule replaced four separate automations; the individual rules remain on the sheet but are inactive.\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.5rem;\">Sheet 4 · MISC payments and reconciliation<\u002Fdiv>\n          <p style=\"margin:0 0 0.75rem;\">Requests arrive from Sheet 2 for ATG or Reimbursement Person entertainment purchases, or from Sheet 3 for IDT and PO payments. Entertainment POs arrive after PO approval; the accountant waits for the invoice.<\u002Fp>\n          <sc-for list=\"{{ misc4Sections }}\" as=\"sec\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:1px solid var(--color-border); padding:1rem 0;\">\n              <div sc-camel-on-click=\"{{ sec.toggle }}\" style=\"display:flex; justify-content:space-between; align-items:center; cursor:pointer;\">\n                <span style=\"font-weight:700; color:var(--ut-charcoal);\">{{ sec.title }}<\u002Fspan>\n                <span style=\"color:var(--ut-burnt-orange); font-size:1.25rem; font-weight:700;\">{{ sec.icon }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sec.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <ol style=\"margin:0.75rem 0 0; padding-left:1.25rem; line-height:1.6;\">\n                  <sc-for list=\"{{ sec.items }}\" as=\"li\" hint-placeholder-count=\"3\">\n                    <li>{{ li.t }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Fol>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"background:#fdf1e6; border-left:3px solid var(--ut-burnt-orange); border-radius:var(--border-radius-sm); padding:0.9rem 1.1rem; margin-top:1rem; font-size:var(--text-sm);\">\n            <strong style=\"color:var(--ut-burnt-orange);\">Finish every MISC payment:<\u002Fstrong> enter Fiscal Year, save and refresh, then set Status to Purchase Reconciled. Save and refresh again as needed. The row moves to the appropriate fiscal-year archive. As of July 24, 2026, the MISC Sheet 4 date-recording automation is inactive; the reconciled date records on Sheet 5 when the row arrives.\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Sheet 4.VP7 · Procard reconciliation<\u002Fdiv>\n          <ol style=\"margin:0; padding-left:1.25rem; line-height:1.7;\">\n            <li>On arrival from Sheet 3, the accountant is notified and Status becomes Waiting for VP7.<\u002Fli>\n            <li>Once the VP7 Doc ID is received, enter it in Payment Voucher ID; Status changes to Ready for Payment. Meriem/Norma update the VP7 Doc ID directly; the accountant helps other procard holders.<\u002Fli>\n            <li>Monitor DEFINE for the VP7 charge to appear during reconciliation, adding the VT6 Doc ID to Comments if one exists.<\u002Fli>\n            <li>Once the charge appears, mark VP7 Approved, match the total charge, and reconcile in DEFINE.<\u002Fli>\n            <li>Enter the Fiscal Year, then set Status to Purchase Reconciled. The row moves automatically to the correct fiscal-year archive.<\u002Fli>\n          <\u002Fol>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Communicating about a request<\u002Fdiv>\n          <p style=\"margin:0 0 0.4rem;\"><strong>Option 1 · Direct comment<\u002Fstrong> — for people already shared on the sheet. Open the row’s Conversations tab, type your comment, and tag their email address; they’ll be notified and can respond on the sheet.<\u002Fp>\n          <p style=\"margin:0;\"><strong>Option 2 · Update request<\u002Fstrong> — for requesters who submitted via form. Right-click the row, select Send Update Request, enter the requester’s email, limit the included fields to what they need (at minimum Comments), and click Send Now. Their response populates the Comments field directly.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:2rem;\">\n          <sc-for list=\"{{ roleSummaries }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <a href=\"#\" sc-camel-on-click=\"{{ r.select }}\" style=\"display:block; background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.25rem; text-decoration:none;\">\n              <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); letter-spacing:0.05em;\">{{ r.num }} / {{ r.role }}<\u002Fdiv>\n              <div style=\"font-weight:700; color:var(--ut-charcoal); margin-top:0.25rem;\">{{ r.desc }} ↗<\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- ============ PURCHASER ============ -->\n    <sc-if value=\"{{ isPurchaser }}\" hint-placeholder-val=\"{{ false }}\">\n      <div data-screen-label=\"Purchaser\">\n        <div style=\"font-size:var(--text-xs); font-weight:700; letter-spacing:0.08em; color:var(--ut-burnt-orange); text-transform:uppercase;\">UTCS purchasing system<\u002Fdiv>\n        <h1 style=\"font-family:var(--font-serif); font-weight:700; font-size:var(--text-4xl); color:var(--ut-charcoal); margin:0.25rem 0 0.5rem;\">Purchaser workflow<\u002Fh1>\n        <p style=\"font-size:var(--text-lg); color:var(--color-text-muted); margin:0 0 1.25rem;\">Process approved requests, record orders and receipts, and hand off for payment.<\u002Fp>\n        <div style=\"display:flex; gap:0.75rem; flex-wrap:wrap;\">\n          <x-import component-from-global-scope=\"UTAustinITSUTXDesignSystem_c2776b.Button\" variant=\"primary\" hint-size=\"auto,44px\"><a href=\"#\" style=\"color:#fff; text-decoration:none;\">Open Smartsheet workspace ↗<\u002Fa><\u002Fx-import>\n          <a href=\"https://app.smartsheet.com/dynamicview/views/766a4150-403e-4b7f-a736-2ba2a799a25d\" target=\"_blank\" style=\"display:inline-flex; align-items:center; gap:0.35rem; padding:0.5rem 1rem; border:1px solid var(--ut-burnt-orange); border-radius:var(--border-radius); color:var(--ut-burnt-orange); font-weight:600; font-size:var(--text-base); text-decoration:none;\" style-hover=\"background:#fdf1e6;\">Open Dynamic View ↗<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:2rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Working in Sheet 3<\u002Fdiv>\n          <p style=\"margin:0 0 0.9rem;\">Sheet 3 is the working sheet for approved purchase requests. Arrival notifications and status automations put the request <strong>In Purchasing Review<\u002Fstrong>.<\u002Fp>\n          <div style=\"background:#fdf1e6; border-left:3px solid var(--ut-burnt-orange); border-radius:var(--border-radius-sm); padding:0.9rem 1.1rem; margin-bottom:0.9rem;\">\n            <strong style=\"color:var(--ut-burnt-orange);\">Attach documents to the request row, not to the sheet.<\u002Fstrong> Mark a request received only after all items arrive. Record partial deliveries in Comments, for example “4/17: Item #1 received.”\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid var(--color-border); padding-top:0.75rem;\">\n            <div sc-camel-on-click=\"{{ dynView.toggle }}\" style=\"display:flex; justify-content:space-between; align-items:center; cursor:pointer;\">\n              <span style=\"font-weight:700; color:var(--ut-charcoal);\">Dynamic View and receiving access<\u002Fspan>\n              <span style=\"color:var(--ut-burnt-orange); font-size:1.25rem; font-weight:700;\">{{ dynView.icon }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ dynView.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <ul style=\"margin:0.75rem 0 0; padding-left:1.25rem; line-height:1.6;\">\n                <li>Jayvin/April/Noemi (JAN) use Dynamic View as purchasers via the “3. Purchasing Sheet – All” view; Meriem/Norma work directly on the Purchasing sheet.<\u002Fli>\n                <li>Student workers use Dynamic View: log in, open “Items Waiting to Be Received,” click a PReq, and set the status to Received and Ready for Pickup once all items arrive — or add a comment for partial deliveries.<\u002Fli>\n              <\u002Ful>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.5rem;\">Choose the purchase scenario<\u002Fdiv>\n          <sc-for list=\"{{ scenarios }}\" as=\"sec\" hint-placeholder-count=\"5\">\n            <div style=\"border-top:1px solid var(--color-border); padding:1rem 0;\">\n              <div sc-camel-on-click=\"{{ sec.toggle }}\" style=\"display:flex; justify-content:space-between; align-items:center; cursor:pointer;\">\n                <span style=\"font-weight:700; color:var(--ut-charcoal);\">{{ sec.title }}<\u002Fspan>\n                <span style=\"color:var(--ut-burnt-orange); font-size:1.25rem; font-weight:700;\">{{ sec.icon }}<\u002Fspan>\n              <\u002Fdiv>\n              <sc-if value=\"{{ sec.isOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                <ol style=\"margin:0.75rem 0 0; padding-left:1.25rem; line-height:1.6;\">\n                  <sc-for list=\"{{ sec.items }}\" as=\"li\" hint-placeholder-count=\"3\">\n                    <li>{{ li.t }}<\u002Fli>\n                  <\u002Fsc-for>\n                <\u002Fol>\n                <sc-if value=\"{{ sec.callout }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#fdf1e6; border-left:3px solid var(--ut-burnt-orange); border-radius:var(--border-radius-sm); padding:0.75rem 1rem; margin-top:0.75rem; font-size:var(--text-sm);\">{{ sec.callout }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Notifications, reminders, and cancellations<\u002Fdiv>\n          <ul style=\"margin:0; padding-left:1.25rem; line-height:1.7;\">\n            <li><strong>Invoice requests:<\u002Fstrong> for non-entertainment PO and IDT requests, the final-invoice update request goes only to the requester. The purchaser and additional CC are intentionally excluded under the July 21, 2026 workflow decision.<\u002Fli>\n            <li><strong>Review reminder:<\u002Fstrong> one week after Item Needed By, a request still In Purchasing Review triggers a purchaser reminder.<\u002Fli>\n            <li><strong>Delivery reminder:<\u002Fstrong> two weeks after Date Ordered, a blank received date triggers a purchaser reminder.<\u002Fli>\n            <li><strong>Cancel a request:<\u002Fstrong> setting Status to CANCELED moves the row to Sheet 6 · Canceled PReqs. Toggle it back to Sheet 3 to resume.<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n\n        <div style=\"background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.5rem; margin-top:1.5rem;\">\n          <div style=\"font-weight:700; font-size:var(--text-lg); color:var(--ut-charcoal); margin-bottom:0.75rem;\">Communicating about a request<\u002Fdiv>\n          <p style=\"margin:0 0 0.4rem;\"><strong>Option 1 · Direct comment<\u002Fstrong> — for people already shared on the sheet. Open the row’s Conversations tab, type your comment, and tag their email address; they’ll be notified and can respond on the sheet.<\u002Fp>\n          <p style=\"margin:0;\"><strong>Option 2 · Update request<\u002Fstrong> — for requesters who submitted via form. Right-click the row, select Send Update Request, enter the requester’s email, limit the included fields to what they need (at minimum Comments), and click Send Now. Their response populates the Comments field directly.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; margin-top:2rem;\">\n          <sc-for list=\"{{ roleSummaries }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <a href=\"#\" sc-camel-on-click=\"{{ r.select }}\" style=\"display:block; background:#fff; border:1px solid var(--color-border); border-radius:var(--border-radius); padding:1.25rem; text-decoration:none;\">\n              <div style=\"font-size:var(--text-xs); font-weight:700; color:var(--color-text-muted); letter-spacing:0.05em;\">{{ r.num }} / {{ r.role }}<\u002Fdiv>\n              <div style=\"font-weight:700; color:var(--ut-charcoal); margin-top:0.25rem;\">{{ r.desc }} ↗<\u002Fdiv>\n            <\u002Fa>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <!-- Footer -->\n  <footer style=\"background:var(--ut-charcoal); color:#c9ccce; padding:1.5rem; margin-top:2rem;\">\n    <div style=\"max-width:1140px; margin:0 auto; font-size:var(--text-sm);\">\n      <span>UTCS Purchasing System<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    tab: 'overview',\n    open: {\n      r1: true, r2: true, r3: true, r4: true,\n      autoAssign: false,\n      idt: false, vp1: false, vp2: false, vpe: false,\n      dynView: false,\n      s1: true, s2: false, s3: false, s4: false, s5: false,\n    },\n  };\n\n  setTab(id) { this.setState({ tab: id }); }\n  toggle(key) { this.setState(s => ({ open: { ...s.open, [key]: !s.open[key] } })); }\n\n  mk(title, key, items, callout) {\n    const isOpen = this.state.open[key];\n    return {\n      key, title, isOpen, icon: isOpen ? '\\u2013' : '+',\n      toggle: () => this.toggle(key),\n      items: items.map(t => ({ t })),\n      callout: callout || '',\n    };\n  }\n\n  renderVals() {\n    const open = this.state.open;\n    const tabDefs = [\n      { id: 'overview', label: 'Overview' },\n      { id: 'requester', label: 'Requester' },\n      { id: 'accountant', label: 'Accountant' },\n      { id: 'purchaser', label: 'Purchaser' },\n    ];\n    const tabs = tabDefs.map(t => ({\n      label: t.label,\n      select: () => this.setTab(t.id),\n      color: this.state.tab === t.id ? 'var(--ut-burnt-orange)' : 'var(--ut-charcoal)',\n      borderColor: this.state.tab === t.id ? 'var(--ut-burnt-orange)' : 'transparent',\n    }));\n\n    const roleSummaries = [\n      { num: '01', role: 'REQUESTER', desc: 'Prepare and submit a request', select: () => this.setTab('requester'), hideWorkspace: true },\n      { num: '02', role: 'ACCOUNTANT', desc: 'Review, pay, and reconcile', select: () => this.setTab('accountant') },\n      { num: '03', role: 'PURCHASER', desc: 'Order and receive purchases', select: () => this.setTab('purchaser') },\n    ];\n\n    const requesterSections = [\n      {\n        key: 'r1', title: '1. Requester and purchase details', isOpen: open.r1, icon: open.r1 ? '\\u2013' : '+',\n        toggle: () => this.toggle('r1'),\n        items: [\n          { b: 'Requestor Name and Requestor Email:', t: 'enter your contact information.' },\n          { b: 'Are you a student or postdoc?', t: 'Select Yes or No. If Yes, enter the name and email of the professor, faculty member, or supervisor who authorized the purchase.' },\n          { b: 'Order Summary:', t: 'use \\u201c[Lab/Group Name]: [Description]\\u201d, for example \\u201cNCWIT: Balloons and Smiles Decorations.\\u201d' },\n          { b: 'Total $ Requested, Purpose, and Dept group:', t: 'complete each field.' },\n          { b: 'Lab Group/Student Org?', t: 'Select Yes or No. If Yes, supply the group or organization name.' },\n          { b: 'Additional Email Recipient CC:', t: 'optionally add one additional email recipient.' },\n        ],\n      },\n      {\n        key: 'r2', title: '2. Entertainment and event purchases', isOpen: open.r2, icon: open.r2 ? '\\u2013' : '+',\n        toggle: () => this.toggle('r2'),\n        items: [\n          { b: '', t: 'For food-related items, select Yes for Entertainment Purchase; otherwise select No.' },\n          { b: '', t: 'If Yes, enter Event Date, Event Type, Event Location, and Event Order Method. Order methods include ATG, Reimbursement, IDT, PO/Contract, and Procard.' },\n          { b: '', t: 'For blanket events, enter the first event date in Event Date and all remaining dates in Comments.' },\n        ],\n      },\n      {\n        key: 'r3', title: '3. Account, vendor, and ordering', isOpen: open.r3, icon: open.r3 ? '\\u2013' : '+',\n        toggle: () => this.toggle('r3'),\n        items: [\n          { b: 'Account:', t: 'enter the account to be billed. If unsure, enter the account name or \\u201cTBD.\\u201d Add any applicable budget line item in Comments.' },\n          { b: 'Vendor name', t: 'is required. Vendor contact, phone, and address are optional.' },\n          { b: 'Are you planning to place the order yourself?', t: 'Check the box if yes. If paying out of pocket, attach receipts. If the purchase has not yet been made, an automatic email will request the invoice or receipt.' },\n          { b: 'Will this be an Interdepartmental Transfer (IDT)?', t: 'If you are paying another UT department or entity (e.g., Parking or Document Solutions), check the IDT box on the form.' },\n          { b: '', t: 'Use the optional Comments field for supporting information.' },\n        ],\n      },\n      {\n        key: 'r4', title: '4. Supporting files and delivery', isOpen: open.r4, icon: open.r4 ? '\\u2013' : '+',\n        toggle: () => this.toggle('r4'),\n        items: [\n          { b: '', t: 'Attach the relevant quote, invoice, contract, or receipt. A file description is required for every attachment.' },\n          { b: '', t: 'For multiple items, attach the Purchase Request Order Form listing all items. The intake form provides the order-form link.' },\n          { b: '', t: 'For non-entertainment purchases, the form can show the equipment-use location and optional delivery or review fields.' },\n          { b: 'Shipping', t: 'defaults to Standard ground. You may enter Item is needed by and select Insurance needed, Request Tech Staff Review, or Request extended warranty information. Without tech staff review, items may not be supported by staff.' },\n        ],\n      },\n    ];\n\n    const accountingGroups = [\n      { name: 'CDSO', desc: 'Online Masters', email: 'cdsoadmin@austin.utexas.edu' },\n      { name: 'UTCS Accounting', desc: 'Instructional, Admin, Student Orgs', email: 'accounting@cs.utexas.edu' },\n      { name: 'CSGS', desc: 'Research Faculty, Texas Robotics, MLL', email: 'csgs@cs.utexas.edu' },\n    ];\n\n    const sheet2Steps = [\n      { b: '', t: 'On arrival, the request becomes PreqSubmitted/Pending Account #. The assigned accountant is notified; the requester, supervisor, and additional recipient receive the submission notification.' },\n      { b: '', t: 'Confirm that the request belongs to your faculty or lab portfolio, then assign yourself as accountant. The accounting group is assigned automatically by department group.' },\n      { b: '', t: 'For a student or postdoc with a supervisor listed, change Status to Requesting Supervisor Approval. The supervisor receives an update request to approve, decline, or request changes, and may supply a preferred account name.' },\n      { b: '', t: 'Enter the numerical Account number and applicable Code 3, Code 5, and Code 6 values.' },\n      { b: '', t: 'Confirm that a purchaser is assigned. The current assignment rule defaults to Norma Belt; if blank, refresh, then assign Norma manually if needed.' },\n      { b: '', t: 'Check Accountant Reviewed & Approved? Qualifying entertainment requests with ATG or Reimbursement Person move to Sheet 4. Other requests move to Sheet 3.' },\n    ];\n\n    const autoAssign = { toggle: () => this.toggle('autoAssign'), isOpen: open.autoAssign, icon: open.autoAssign ? '\\u2013' : '+' };\n\n    const misc4Sections = [\n      this.mk('IDT \\u00b7 Interdepartmental Transfer', 'idt', [\n        'Monitor DEFINE for the IDT charge to appear on the account.',\n        'Update Document ID.',\n        'Match the total charge in DEFINE against the IDT order or receipt and reconcile, adding the PReq number on the DTN line (command LR3, hit E to reach the final reconcile screen).',\n        'Enter the Fiscal Year, save and refresh, then set Status to Purchase Reconciled. Save and refresh again.',\n      ]),\n      this.mk('VP1 \\u00b7 Purchase order payment', 'vp1', [\n        'Row arrives with a PO number and invoice already attached.',\n        'Download the invoice from the row.',\n        'Submit a VP1 payment voucher in DEFINE and update Document ID.',\n        'After VP1 is approved, match the total charge to the account and reconcile in DEFINE \\u2014 double-check the DTN number is the correct PReq number.',\n        'Enter the Fiscal Year, save and refresh, then set Status to Purchase Reconciled.',\n      ]),\n      this.mk('VP2 \\u00b7 Payment voucher', 'vp2', [\n        'Row arrives with an invoice attached.',\n        'Download the invoice, submit a VP2 payment voucher in DEFINE, and update Document ID and Payment Method.',\n        'After VP2 is approved, match the total charge to the account and reconcile \\u2014 double-check the DTN number.',\n        'Enter the Fiscal Year, then set Status to Purchase Reconciled.',\n      ]),\n      this.mk('VPE \\u00b7 ATG or Reimbursement Person', 'vpe', [\n        'An update request is automatically sent to the requester, additional email CC, and supervisor asking for the final event invoice.',\n        'Monitor the update request icon, the right-side panel, or the Pending Entertainment Invoices report for the completed invoice.',\n        'Once attached, download the invoice and process a VPE payment voucher in DEFINE, including the PReq number on the DTN line.',\n        'Update Document ID and set Payment Method to VPE.',\n        'After VPE is approved, match and reconcile in DEFINE, then enter the Fiscal Year and set Status to Purchase Reconciled.',\n      ]),\n    ];\n\n    const dynView = { toggle: () => this.toggle('dynView'), isOpen: open.dynView, icon: open.dynView ? '\\u2013' : '+' };\n\n    const scenarios = [\n      this.mk('1. Entertainment purchase \\u00b7 PO required', 's1', [\n        'Create the PO and set Status to PO Created.',\n        'After approval, attach the PO to the row, enter PO number, and set Status to PO Approved.',\n        'Payment Method automatically becomes VP1. The accountant, requester, applicable supervisor, and additional recipient are notified with the PO attachment.',\n        'The row moves directly to Sheet 4 \\u00b7 MISC Payments & Reconciliation. The accountant takes over and waits for the invoice.',\n      ], 'Entertainment POs skip Ordered and Received & Ready for Pick Up.'),\n      this.mk('2. Entertainment purchase \\u00b7 Procard/VP7', 's2', [\n        'Order items from HEB, Central Market, or Amazon, then attach the receipt to the row and set Status to Ordered.',\n        'Once received, set Status to Received & Ready for Pick Up \\u2014 wait for all items before changing status; note partial deliveries in Comments.',\n        'Update VP7 Approved? to Pending and confirm Total $ Charged is filled in, then set Status to Ready for Payment.',\n        'The row moves to Sheet 4.VP7. Once the VP7 is approved, update VP7 Approved? to Approve and enter the Payment Voucher ID.',\n      ]),\n      this.mk('3. Non-entertainment purchase \\u00b7 PO required', 's3', [\n        'Create the PO and set Status to PO Created; once approved, attach the PO, enter the PO number, and set Status to PO Approved.',\n        'Payment Method automatically becomes VP1.',\n        'Order the item, enter Total $ Charged, and set Status to Ordered; once received, set Status to Received & Ready for Pick Up.',\n        'An invoice update request is sent to the requester only; Status automatically changes to Pending Invoice.',\n        'Once the invoice is attached, check Invoice Uploaded, confirm PO number and Total $ Charged are filled in, then set Status to Ready for Payment.',\n      ]),\n      this.mk('4. Non-entertainment purchase \\u00b7 Procard/VP7', 's4', [\n        'Update Payment Method to Procard/VP7.',\n        'Order items, attach the receipt, and set Status to Ordered; once received, set Status to Received & Ready for Pick Up.',\n        'Update VP7 Approved? to Pending and confirm Total $ Charged, then set Status to Ready for Payment.',\n        'The row moves to Sheet 4.VP7 for final approval and Payment Voucher ID entry.',\n      ]),\n      this.mk('5. IDT \\u00b7 Interdepartmental Transfer', 's5', [\n        'Confirm whether the requester is placing the order themselves; if not, coordinate with them, then set Payment Method to IDT.',\n        'Confirm with the requester when the order was placed and set Status to Ordered; once received, set Status to Received & Ready for Pick Up.',\n        'An invoice update request is sent to the requester only; once attached, check Invoice Uploaded and set Status to Ready for Payment.',\n        'The row moves to Sheet 4 \\u00b7 MISC Payments & Reconciliation.',\n      ]),\n    ];\n\n    return {\n      tab: this.state.tab,\n      isOverview: this.state.tab === 'overview',\n      isRequester: this.state.tab === 'requester',\n      isAccountant: this.state.tab === 'accountant',\n      isPurchaser: this.state.tab === 'purchaser',\n      showWorkspaceLink: this.state.tab !== 'requester',\n      tabs, roleSummaries, requesterSections,\n      accountingGroups, sheet2Steps, autoAssign, misc4Sections,\n      dynView, scenarios,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
